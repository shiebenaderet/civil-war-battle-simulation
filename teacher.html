<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard — Civil War Battle Simulation</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: #f5f5f0;
            color: #222;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }
        .room-info {
            font-size: 13px;
            opacity: 0.85;
        }
        .controls {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 12px 24px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }
        .pill-group {
            display: flex;
            gap: 4px;
        }
        .pill {
            padding: 4px 12px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            color: #444;
        }
        .pill.active {
            background: #2c3e50;
            color: #fff;
            border-color: #2c3e50;
        }
        .status-line {
            font-size: 12px;
            color: #666;
            padding: 8px 24px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
        .status-line.error {
            color: #b00;
            background: #fff5f5;
        }
        main {
            padding: 16px 24px 48px;
        }
        .battle-row {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e0;
            align-items: start;
        }
        .battle-label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }
        .battle-label .date {
            font-weight: 400;
            color: #888;
            font-size: 12px;
            display: block;
            margin-top: 2px;
        }
        .battle-row.empty .student-list {
            color: #aaa;
            font-style: italic;
            font-size: 13px;
        }
        .student-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .student-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 14px;
            font-size: 13px;
            color: #222;
        }
        .student-chip.stale {
            opacity: 0.5;
        }
        .student-chip .period-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            background: #eee;
            color: #555;
        }
        .student-chip .period-tag.p1 { background: #fde2e2; color: #9a3412; }
        .student-chip .period-tag.p2 { background: #fef3c7; color: #92400e; }
        .student-chip .period-tag.p4 { background: #d1fae5; color: #065f46; }
        .student-chip .period-tag.p5 { background: #dbeafe; color: #1e40af; }
        .student-chip .period-tag.unknown { background: #e5e5e5; color: #666; }
        .student-chip .last-seen {
            font-size: 11px;
            color: #888;
        }
        .finished-row .battle-label { color: #166534; }
        .finished-row .student-chip { background: #f0fdf4; border-color: #bbf7d0; }
        .student-chip-delete {
            margin-left: 4px;
            background: transparent;
            border: none;
            color: #b91c1c;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0 2px;
            opacity: 0.4;
        }
        .student-chip:hover .student-chip-delete { opacity: 1; }
        .sort-mode-period .battle-row,
        .sort-mode-name .battle-row {
            display: none;
        }
        .sort-mode-period .grouped-section,
        .sort-mode-name .grouped-section {
            margin-bottom: 24px;
        }
        .grouped-section {
            display: none;
        }
        .sort-mode-period .grouped-section,
        .sort-mode-name .grouped-section {
            display: block;
        }
        .group-heading {
            font-weight: 700;
            color: #2c3e50;
            font-size: 14px;
            padding: 12px 0 6px;
            border-bottom: 1px solid #e5e5e0;
            margin-bottom: 8px;
        }
        .group-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .totals {
            font-size: 13px;
            color: #555;
        }
        button.refresh-btn {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #333;
        }

        /* --- Tabs (Progress / Leaderboard) --- */
        .tab-bar {
            display: flex;
            gap: 4px;
            background: #2c3e50;
            padding: 0 24px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #cdd6df;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 18px;
            cursor: pointer;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: #f5f5f0;
        }

        /* --- Code chips in header --- */
        .code-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .code-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 14px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            transition: background 0.12s ease;
        }
        .code-chip:hover {
            background: rgba(255,255,255,0.24);
        }
        .code-chip .chip-period {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.85;
        }
        .code-chip .chip-code {
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            letter-spacing: 0.5px;
        }

        /* --- Fullscreen class-code overlay --- */
        .code-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f3ead8;
            color: #2c3e50;
            cursor: pointer;
            padding: 24px;
            text-align: center;
        }
        .code-overlay.show { display: flex; }
        .code-overlay .overlay-period {
            font-size: clamp(28px, 6vw, 64px);
            font-weight: 600;
            margin-bottom: 24px;
            color: #6b5b3e;
            letter-spacing: 1px;
        }
        .code-overlay .overlay-code {
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: clamp(64px, 22vw, 320px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 4px;
            word-break: break-word;
        }
        .code-overlay .overlay-hint {
            margin-top: 40px;
            font-size: clamp(14px, 2vw, 20px);
            color: #8a7c5e;
        }

        /* --- Leaderboard view --- */
        #leaderboardView { display: none; }
        body.tab-leaderboard #leaderboardView { display: block; }
        body.tab-leaderboard #dashboardMain { display: none; }
        /* Progress-only controls hidden on the leaderboard tab */
        body.tab-leaderboard #sortControlGroup,
        body.tab-leaderboard #clearAllBtn,
        body.tab-leaderboard .filter-noperiod { display: none; }

        /* --- Global leaderboard view (reuses .lb-* table styles) --- */
        #globalView { display: none; }
        body.tab-global #globalView { display: block; }
        body.tab-global #dashboardMain { display: none; }
        /* Period filter and progress-only controls do not apply to global scores */
        body.tab-global #sortControlGroup,
        body.tab-global #clearAllBtn,
        body.tab-global .control-group { display: none; }

        /* --- Questions view (per-question first-try miss rate) --- */
        #questionsView { display: none; }
        body.tab-questions #questionsView { display: block; }
        body.tab-questions #dashboardMain { display: none; }
        body.tab-questions #sortControlGroup,
        body.tab-questions #clearAllBtn { display: none; }
        .q-act-group { margin: 18px 0 6px; font-weight: 700; color: #333; font-size: 15px; }
        .q-row { cursor: pointer; }
        .q-row:hover td { background: #fafaf7; }
        .q-miss-hi { color: #b3261e; font-weight: 700; }
        .q-names { font-size: 13px; color: #555; padding: 4px 12px 12px; background: #fbfaf6; }

        /* --- Guest Book view --- */
        #guestbookView { display: none; }
        body.tab-guestbook #guestbookView { display: block; }
        body.tab-guestbook #dashboardMain { display: none; }
        body.tab-guestbook #sortControlGroup,
        body.tab-guestbook #clearAllBtn { display: none; }
        .visitor-map { width: 100%; height: auto; display: block; background: #a9c7e0; border: 1px solid #ccc; }
        .visitor-pin { fill: #6b2419; stroke: #fff; stroke-width: 0.6; }
        .visitor-map-popup { font-family: serif; font-size: 14px; fill: #2a1f12; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
        .lb-mini-btn { font-size: 12px; padding: 2px 8px; margin-left: 4px; cursor: pointer; }

        .lb-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .lb-table th {
            text-align: left;
            font-size: 12px;
            color: #555;
            font-weight: 700;
            padding: 8px 10px;
            border-bottom: 2px solid #e5e5e0;
        }
        .lb-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        .lb-table tr:hover td { background: #fafaf7; }
        .lb-rank {
            font-weight: 700;
            color: #888;
            width: 44px;
        }
        .lb-name { font-weight: 600; color: #222; }
        .lb-side {
            text-transform: capitalize;
            font-size: 13px;
            color: #555;
        }
        .lb-side.union { color: #1e40af; }
        .lb-side.confederacy { color: #9a3412; }
        .lb-score { font-weight: 700; color: #2c3e50; }
        .lb-wl { color: #555; font-variant-numeric: tabular-nums; }
        .lb-victory {
            margin-left: 6px;
            font-size: 12px;
            color: #166534;
        }
        .lb-actions { white-space: nowrap; text-align: right; }
        .lb-period-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            background: #eee;
            color: #555;
        }
        .lb-period-tag.p1 { background: #fde2e2; color: #9a3412; }
        .lb-period-tag.p2 { background: #fef3c7; color: #92400e; }
        .lb-period-tag.p4 { background: #d1fae5; color: #065f46; }
        .lb-period-tag.p5 { background: #dbeafe; color: #1e40af; }
        .lb-period-tag.unknown { background: #e5e5e5; color: #666; }
        .lb-action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 2px 6px;
            opacity: 0.55;
        }
        .lb-action-btn:hover { opacity: 1; }
        .lb-action-btn.delete { color: #b91c1c; }
        .lb-action-btn.rename { color: #2c3e50; }
        .lb-empty {
            color: #999;
            font-style: italic;
            padding: 24px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Teacher Dashboard</h1>
            <div class="code-chips" id="codeChips"></div>
        </div>
        <div class="room-info">
            Room: <strong id="roomLabel">…</strong>
            &nbsp;·&nbsp;
            <span class="totals" id="totalsLabel">0 students</span>
        </div>
    </header>

    <nav class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="progress" type="button">Progress</button>
        <button class="tab-btn" data-tab="leaderboard" type="button">Leaderboard</button>
        <button class="tab-btn" data-tab="global" type="button">Global</button>
        <button class="tab-btn" data-tab="questions" type="button">Questions</button>
        <button class="tab-btn" data-tab="guestbook" type="button">Guest Book</button>
    </nav>

    <div class="controls">
        <div class="control-group" id="sortControlGroup">
            <span class="control-label">Sort:</span>
            <div class="pill-group" id="sortGroup">
                <button class="pill active" data-sort="battle">Battle</button>
                <button class="pill" data-sort="period">Period</button>
                <button class="pill" data-sort="name">Name</button>
            </div>
        </div>
        <div class="control-group">
            <span class="control-label">Period:</span>
            <div class="pill-group" id="filterGroup">
                <button class="pill active" data-filter="all">All</button>
                <button class="pill" data-filter="1">1st</button>
                <button class="pill" data-filter="2">2nd</button>
                <button class="pill" data-filter="4">4th</button>
                <button class="pill" data-filter="5">5th</button>
                <button class="pill filter-noperiod" data-filter="?">No period</button>
            </div>
        </div>
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
        <button class="refresh-btn" id="clearAllBtn" style="border-color:#b91c1c;color:#b91c1c;">Clear all</button>
    </div>

    <div class="status-line" id="statusLine">Connecting…</div>

    <main id="dashboardMain">
        <div id="battleList"></div>
        <div id="groupedView"></div>
    </main>

    <main id="leaderboardView">
        <div id="leaderboardBody"></div>
    </main>

    <main id="globalView">
        <div id="globalBody"></div>
    </main>

    <main id="questionsView">
        <table class="lb-table" id="questionsTable">
            <thead><tr><th>Question</th><th>Students</th><th>Missed first try</th></tr></thead>
            <tbody id="questionsBody"></tbody>
        </table>
        <p id="questionsEmpty" style="padding:16px;color:#777;display:none;">No recall answers recorded yet.</p>
    </main>

    <main id="guestbookView">
        <div id="guestbookMapMount" style="margin-bottom:16px;"></div>
        <table class="lb-table" id="guestbookTable">
            <thead><tr><th>School</th><th>Location</th><th>When</th><th></th></tr></thead>
            <tbody id="guestbookBody"></tbody>
        </table>
        <p id="guestbookEmpty" style="padding:16px;color:#777;display:none;">No guest book signatures yet.</p>
    </main>

    <!-- Fullscreen class-code overlay (for projecting) -->
    <div class="code-overlay" id="codeOverlay" role="dialog" aria-modal="true">
        <div class="overlay-period" id="overlayPeriod"></div>
        <div class="overlay-code" id="overlayCode"></div>
        <div class="overlay-hint">Click anywhere or press Escape to close.</div>
    </div>

    <!-- Firebase SDK (same versions as main app) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <!-- App data + Firebase wrapper -->
    <script src="js/data/battles.js"></script>
    <script src="js/data/acts.js"></script>
    <script src="js/data/geo.js"></script>
    <script src="js/firebase-leaderboard.js"></script>

    <script>
    (function() {
        var STALE_AFTER_MS = 5 * 60 * 1000; // 5 minutes since lastSeen = stale
        var DASHBOARD_PASSWORD = 'amsmustangs';
        var SESSION_AUTH_KEY = 'teacherDashboardAuthed';

        // Escape dynamic text before injecting via innerHTML.
        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function requireAuth() {
            try {
                if (sessionStorage.getItem(SESSION_AUTH_KEY) === '1') return true;
            } catch (e) {}
            var entered = window.prompt('Teacher password:');
            if (entered === DASHBOARD_PASSWORD) {
                try { sessionStorage.setItem(SESSION_AUTH_KEY, '1'); } catch (e) {}
                return true;
            }
            var deny = document.createElement('div');
            deny.style.cssText = 'padding:40px;text-align:center;font-family:sans-serif;font-size:18px;color:#666';
            deny.textContent = 'Access denied.';
            document.body.replaceChildren(deny);
            return false;
        }

        var state = {
            sort: 'battle',
            filter: 'all',
            entries: [],
            perRoom: {},
            lastUpdate: 0,
            tab: 'progress',
            lbEntries: [],
            lbLoading: false,
            gbEntries: [],
            gbLoading: false,
            recallRows: {},
            guestbookEntries: []
        };

        function init() {
            if (!requireAuth()) return;
            firebaseLeaderboard.init();

            if (!firebaseLeaderboard.isAvailable()) {
                setStatus('Firebase unavailable. Check your internet connection.', true);
                return;
            }

            var rooms = firebaseLeaderboard.getAllPeriodRooms();
            document.getElementById('roomLabel').textContent =
                Object.keys(rooms).map(function(p) { return 'P' + p; }).join(', ');
            renderCodeChips(rooms);

            state.perRoom = {};

            setStatus('Listening for student progress…');
            Object.keys(rooms).forEach(function(period) {
                var code = rooms[period];
                firebaseLeaderboard.subscribeToProgress(code, function(entries, err) {
                    if (err) {
                        setStatus('Period ' + period + ': ' + err, true);
                        return;
                    }
                    state.perRoom[period] = (entries || []).map(function(e) {
                        e.period = period;
                        e._sourceRoom = code;
                        return e;
                    });
                    state.entries = Object.keys(state.perRoom).reduce(function(acc, p) {
                        return acc.concat(state.perRoom[p]);
                    }, []);
                    state.lastUpdate = Date.now();
                    render();
                    setStatus('Updated ' + new Date().toLocaleTimeString() +
                              ' · ' + state.entries.length + ' student' +
                              (state.entries.length === 1 ? '' : 's'));
                });
            });

            // v3.22: subscribe to per-question recall results for the Questions tab.
            Object.keys(rooms).forEach(function(period) {
                var rcode = rooms[period];
                firebaseLeaderboard.subscribeToRecall(rcode, function(rows, rerr) {
                    if (rerr) return;
                    state.recallRows[period] = (rows || []).map(function(r) { r.period = period; return r; });
                    if (state.tab === 'questions') renderQuestions();
                });
            });

            // v3.23: subscribe to the public guest book for the Guest Book tab.
            firebaseLeaderboard.subscribeToGuestbook(function(entries, gerr) {
                if (gerr) return;
                state.guestbookEntries = entries || [];
                if (state.tab === 'guestbook') renderGuestbook();
            });

            wireControls();
        }

        function wireControls() {
            document.getElementById('sortGroup').addEventListener('click', function(e) {
                var btn = e.target.closest('.pill');
                if (!btn) return;
                state.sort = btn.dataset.sort;
                setActivePill('sortGroup', btn);
                render();
            });
            document.getElementById('filterGroup').addEventListener('click', function(e) {
                var btn = e.target.closest('.pill');
                if (!btn) return;
                state.filter = btn.dataset.filter;
                setActivePill('filterGroup', btn);
                render();
                if (state.tab === 'leaderboard') renderLeaderboard();
                if (state.tab === 'questions') renderQuestions();
            });
            document.getElementById('refreshBtn').addEventListener('click', function() {
                if (state.tab === 'leaderboard') {
                    loadLeaderboard();
                } else if (state.tab === 'global') {
                    loadGlobalLeaderboard();
                } else if (state.tab === 'questions') {
                    renderQuestions();
                } else {
                    render();
                }
            });

            // Tab toggle: Progress (default live view) vs Leaderboard.
            document.getElementById('tabBar').addEventListener('click', function(e) {
                var btn = e.target.closest('.tab-btn');
                if (!btn) return;
                switchTab(btn.dataset.tab);
            });

            // Fullscreen code overlay: close on click anywhere or Escape.
            var overlay = document.getElementById('codeOverlay');
            overlay.addEventListener('click', closeOverlay);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeOverlay();
            });
            document.getElementById('clearAllBtn').addEventListener('click', function() {
                if (!window.confirm('Delete ALL student progress AND question results from ALL four periods? This cannot be undone.')) return;
                var rooms = firebaseLeaderboard.getAllPeriodRooms();
                var codes = Object.keys(rooms).map(function(p) { return rooms[p]; });
                firebaseLeaderboard.clearAllProgress(codes, function(ok, errMsg) {
                    if (!ok) setStatus(errMsg || 'Clear failed.', true);
                });
                firebaseLeaderboard.clearAllRecall(codes, function(ok, errMsg) {
                    if (!ok) setStatus(errMsg || 'Recall clear failed.', true);
                });
            });
        }

        function setActivePill(groupId, activeBtn) {
            var group = document.getElementById(groupId);
            var pills = group.querySelectorAll('.pill');
            for (var i = 0; i < pills.length; i++) {
                pills[i].classList.toggle('active', pills[i] === activeBtn);
            }
        }

        function setStatus(text, isError) {
            var el = document.getElementById('statusLine');
            el.textContent = text;
            el.classList.toggle('error', !!isError);
        }

        function periodKey(p) {
            return (p === '1' || p === '2' || p === '4' || p === '5') ? p : '?';
        }

        function passesFilter(entry) {
            if (state.filter === 'all') return true;
            return periodKey(entry.period) === state.filter;
        }

        function formatLastSeen(ts) {
            if (!ts) return '';
            var diff = Date.now() - ts;
            if (diff < 60000) return 'just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            return Math.floor(diff / 3600000) + 'h ago';
        }

        function isStale(ts) {
            return ts && (Date.now() - ts) > STALE_AFTER_MS;
        }

        function chip(entry) {
            var c = document.createElement('span');
            c.className = 'student-chip' + (isStale(entry.lastSeen) ? ' stale' : '');

            var pk = periodKey(entry.period);
            var tag = document.createElement('span');
            tag.className = 'period-tag ' + (pk === '?' ? 'unknown' : 'p' + pk);
            tag.textContent = pk === '?' ? '?' : 'P' + pk;
            c.appendChild(tag);

            var name = document.createElement('span');
            name.textContent = entry.name || 'Student';
            c.appendChild(name);

            var ls = document.createElement('span');
            ls.className = 'last-seen';
            ls.textContent = formatLastSeen(entry.lastSeen);
            c.appendChild(ls);

        function renderByBattle() {
            var list = document.getElementById('battleList');
            clear(list);
            document.getElementById('groupedView').textContent = '';

            var visible = state.entries.filter(passesFilter);

            // Group students by currentBattle index
            var byBattle = {};

            for (var i = 0; i < visible.length; i++) {
                var e = visible[i];
                if (e.finished || (e.currentBattle >= (e.totalBattles || battles.length))) {
                    finished.push(e);
                } else {
                    var idx = Math.max(0, Math.min(battles.length - 1, e.currentBattle || 0));
                    if (!byBattle[idx]) byBattle[idx] = [];
                    byBattle[idx].push(e);
                }
            }

            for (var b = 0; b < battles.length; b++) {
                var students = byBattle[b] || [];
                students.sort(function(a, c) { return (a.name || '').localeCompare(c.name || ''); });
                var row = document.createElement('div');
                row.className = 'battle-row' + (students.length === 0 ? ' empty' : '');

                var label = document.createElement('div');

                sl.className = 'student-list';

            // Finished row
            if (finished.length > 0) {
                var fRow = document.createElement('div');
                fRow.className = 'battle-row finished-row';
                var fLabel = document.createElement('div');
                fLabel.className = 'battle-label';

                finished.sort(function(a, c) { return (a.name || '').localeCompare(c.name || ''); });
                for (var f = 0; f < finished.length; f++) {
                    fList.appendChild(chip(finished[f]));

        function renderByGroup(keyFn, labelFn, order, sortFn) {
            var grouped = document.getElementById('groupedView');
            clear(grouped);
            document.getElementById('battleList').textContent = '';

            var visible = state.entries.filter(passesFilter);
            var groups = {};
            for (var i = 0; i < visible.length; i++) {
                var k = keyFn(visible[i]);
                if (!groups[k]) groups[k] = [];
                groups[k].push(visible[i]);
            }

            for (var o = 0; o < order.length; o++) {
                var key = order[o];
                if (!groups[key] || groups[key].length === 0) continue;
                var section = document.createElement('div');
                section.className = 'grouped-section';

                var heading = document.createElement('div');
                heading.className = 'group-heading';
                heading.textContent = labelFn(key) + ' (' + groups[key].length + ')';
                section.appendChild(heading);

                var list = document.createElement('div');
                list.className = 'group-list';

                var arr = groups[key].slice();
                arr.sort(sortFn || function(a, b) {
                    // default: sort by progress descending, then name
                    var diff = (b.currentBattle || 0) - (a.currentBattle || 0);
                    if (diff !== 0) return diff;
                    return (a.name || '').localeCompare(b.name || '');
                });
                for (var s = 0; s < arr.length; s++) {
                    var c = chip(arr[s]);
                    // Append current battle label to the chip for context in non-battle views
                    var battleNum = document.createElement('span');
                    battleNum.className = 'last-seen';
                    var bi = Math.max(0, Math.min(battles.length - 1, arr[s].currentBattle || 0));
                    if (arr[s].finished || arr[s].currentBattle >= battles.length) {
                        battleNum.textContent = '✓ done';
                    } else {
                        battleNum.textContent = 'Battle ' + (bi + 1);
                    }
                    c.insertBefore(battleNum, c.querySelector('.last-seen'));
                    list.appendChild(c);
                }
                section.appendChild(list);
                grouped.appendChild(section);
            }
        }

        // --- Questions tab: per-question first-try miss rate ---

        // Map "<actIndex>_<qIndex>" to a human-readable label using acts.js data.
        // Uses a fixed reference tier so labels are stable regardless of student level.
        function questionLabel(qKey) {
            var parts = qKey.split('_');
            var ai = parseInt(parts[0], 10), qi = parseInt(parts[1], 10);
            try {
                if (typeof acts !== 'undefined' && acts[ai] && acts[ai].recall) {
                    var q = (acts[ai].recall.intermediate && acts[ai].recall.intermediate[qi]) ||
                            (acts[ai].recall.beginner && acts[ai].recall.beginner[qi]) ||
                            (acts[ai].recall.extra && acts[ai].recall.extra[qi]);
                    if (q && q.question) {
                        return 'Act ' + acts[ai].number + ' Q' + (qi + 1) + ': ' + q.question;
                    }
                }
            } catch (e) {}
            return 'Act ' + (ai + 1) + ' Q' + (qi + 1);
        }

        function renderQuestions() {
            var body = document.getElementById('questionsBody');
            var empty = document.getElementById('questionsEmpty');
            body.innerHTML = '';

            // Flatten recall rows across periods, applying the active period filter.
            var rows = [];
            Object.keys(state.recallRows).forEach(function(p) {
                if (state.filter !== 'all' && state.filter !== p) return;
                rows = rows.concat(state.recallRows[p] || []);
            });

            if (!rows.length) { empty.style.display = ''; return; }
            empty.style.display = 'none';

            // Aggregate by question key. A row per (studentId,qKey); count distinct
            // students and how many missed on first try.
            var agg = {};
            rows.forEach(function(r) {
                var k = r.qKey;
                if (!agg[k]) agg[k] = { total: 0, missed: 0, names: [] };
                agg[k].total++;
                if (r.firstTry === false) {
                    agg[k].missed++;
                    agg[k].names.push(r.name || 'Student');
                }
            });

            // Sort worst-first by miss rate, then by sample size.
            var keys = Object.keys(agg).sort(function(a, b) {
                var ra = agg[a].missed / agg[a].total, rb = agg[b].missed / agg[b].total;
                if (rb !== ra) return rb - ra;
                return agg[b].total - agg[a].total;
            });

            keys.forEach(function(k) {
                var a = agg[k];
                var rate = Math.round((a.missed / a.total) * 100);

                // Build cells with textContent (no innerHTML) so student-entered
                // names can never inject HTML.
                var tr = document.createElement('tr');
                tr.className = 'q-row';
                var tdQ = document.createElement('td');
                tdQ.textContent = questionLabel(k);
                var tdN = document.createElement('td');
                tdN.textContent = String(a.total);
                var tdR = document.createElement('td');
                tdR.textContent = rate + '%';
                if (rate >= 40) tdR.className = 'q-miss-hi';
                tr.appendChild(tdQ); tr.appendChild(tdN); tr.appendChild(tdR);

                var namesTr = document.createElement('tr');
                namesTr.style.display = 'none';
                var tdNames = document.createElement('td');
                tdNames.setAttribute('colspan', '3');
                tdNames.className = 'q-names';
                tdNames.textContent = a.names.length
                    ? 'Missed first try: ' + a.names.join(', ')
                    : 'No first-try misses.';
                namesTr.appendChild(tdNames);

                tr.addEventListener('click', function() {
                    namesTr.style.display = (namesTr.style.display === 'none') ? '' : 'none';
                });
                body.appendChild(tr);
                body.appendChild(namesTr);
            });
        }

        // --- Guest Book tab (own renderVisitorMap; dashboard doesn't load ui.js) ---
        // Depends only on geo.js (GEO_WORLD_SVG / GEO_WORLD_VIEWBOX / geoProject).
        // XSS-safe: only innerHTML is the trusted bundled map constant + empty clears;
        // all entry text reaches the DOM via textContent.
        function renderVisitorMap(container, entries, highlightKey) {
            if (!container) return;
            if (typeof GEO_WORLD_SVG === 'undefined') { container.textContent = 'Map unavailable.'; return; }
            var vb = (typeof GEO_WORLD_VIEWBOX !== 'undefined') ? GEO_WORLD_VIEWBOX : '0 0 1000 500';
            container.innerHTML = '';
            var SVG = 'http://www.w3.org/2000/svg';
            var svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('viewBox', vb);
            svg.setAttribute('class', 'visitor-map');
            var land = document.createElementNS(SVG, 'g');
            land.innerHTML = GEO_WORLD_SVG; // trusted constant from geo.js
            svg.appendChild(land);
            var popup = document.createElementNS(SVG, 'text');
            popup.setAttribute('class', 'visitor-map-popup');
            popup.setAttribute('text-anchor', 'middle');
            popup.style.display = 'none';
            (entries || []).forEach(function(e) {
                if (!isFinite(e.lat) || !isFinite(e.lng)) return;
                var p = geoProject(e.lat, e.lng);
                var seed = 0, key = String(e._key || (e.lat + '' + e.lng));
                for (var i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) >>> 0;
                var jx = ((seed % 100) / 100 - 0.5) * 10;
                var jy = (((seed >> 8) % 100) / 100 - 0.5) * 10;
                var px = p.x + jx, py = p.y + jy;
                var dot = document.createElementNS(SVG, 'circle');
                dot.setAttribute('cx', px.toFixed(1));
                dot.setAttribute('cy', py.toFixed(1));
                dot.setAttribute('r', '4');
                dot.setAttribute('class', 'visitor-pin');
                var labelText = (e.school ? e.school + ' — ' : '') + (e.label || '');
                dot.addEventListener('click', function() {
                    popup.textContent = labelText;
                    popup.setAttribute('x', px.toFixed(1));
                    popup.setAttribute('y', (py - 10).toFixed(1));
                    popup.style.display = '';
                });
                svg.appendChild(dot);
            });
            svg.appendChild(popup);
            container.appendChild(svg);
        }

        // --- Feature 2: leaderboard across all period rooms ---

        function loadLeaderboard() {
            var body = document.getElementById('leaderboardBody');
            if (!firebaseLeaderboard.isAvailable()) {
                body.innerHTML = '<div class="lb-empty">Firebase is offline. Leaderboard is unavailable.</div>';
                return;
            }

            var rooms = firebaseLeaderboard.getAllPeriodRooms();
            var periods = Object.keys(rooms);
            var pending = periods.length;
            var collected = [];
            state.lbLoading = true;
            body.innerHTML = '<div class="lb-empty">Loading leaderboard…</div>';

            if (pending === 0) {
                state.lbEntries = [];
                state.lbLoading = false;
                renderLeaderboard();
                return;
            }

            periods.forEach(function(period) {
                var code = rooms[period];
                firebaseLeaderboard.loadLeaderboardWithKeys(code, function(entries, err) {
                    if (!err && entries) {
                        for (var i = 0; i < entries.length; i++) {
                            var e = entries[i];
                            e.period = period;
                            e.roomCode = code;
                            collected.push(e);
                        }
                    }
                    pending--;
                    if (pending <= 0) {
                        collected.sort(function(a, b) { return (b.score || 0) - (a.score || 0); });
                        state.lbEntries = collected;
                        state.lbLoading = false;
                        renderLeaderboard();
                    }
                });
            });
        }

        function lbPassesFilter(entry) {
            // The leaderboard ignores the '?' / No period filter (every score has a room).
            if (state.filter === 'all' || state.filter === '?') return true;
            return periodKey(entry.period) === state.filter;
        }

                    setStatus(errMsg || 'Delete failed.', true);
                    return;
                }
                loadGlobalLeaderboard();
            });
        }

        function handleGlobalRename(entry) {
            var next = window.prompt('New name:', entry.name || '');
            if (next == null) return;
            next = String(next).trim();
            if (!next) return;
            firebaseLeaderboard.renameGlobalScore(entry._key, next, function(ok, errMsg) {
                if (!ok) {
                    setStatus(errMsg || 'Rename failed.', true);
                    return;
                }
                loadGlobalLeaderboard();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
